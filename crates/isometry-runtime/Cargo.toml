[package]
name = "isometry-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
authors = ["Mark <sgt.mark3@gmail.com>"]
repository = "https://github.com/merely-made/isometry"
description = "Isometry's product-owned conductor for shared runtime organs."

[dependencies]
isometry-core = { path = "../isometry-core", version = "0.1.0" }
conatus = { git = "https://github.com/merely-made/mere.git", rev = "e89950bd5e86fa550c57a9a4f56cc67c7b6a2cc0" }
wgpu = { version = "30", default-features = false, features = ["wgsl"], optional = true }
bytemuck = { version = "1", optional = true }
cubecl = { version = "0.11.0-pre.2", default-features = false, features = ["std", "wgpu"], optional = true }
pollster = { version = "0.4", optional = true }
netrender = { git = "https://github.com/merely-made/netrender.git", branch = "main", optional = true }

[features]
default = []
resident-gpu = ["conatus/resident", "dep:wgpu"]
resident-render = ["resident-gpu", "dep:bytemuck"]
netrender-tenant = ["resident-render", "dep:netrender"]
resident-gpu-receipt = [
    "resident-gpu",
    "dep:bytemuck",
    "dep:cubecl",
    "dep:pollster",
    "wgpu/dx12",
    "wgpu/vulkan",
    "wgpu/metal",
]
resident-render-receipt = [
    "netrender-tenant",
    "dep:cubecl",
    "dep:pollster",
    "wgpu/dx12",
    "wgpu/vulkan",
    "wgpu/metal",
]

[[test]]
name = "resident_bodies"
required-features = ["resident-gpu-receipt"]

[[test]]
name = "resident_render"
required-features = ["resident-render-receipt"]

[patch.crates-io]
vello = { git = "https://github.com/mark-ik/vello.git", rev = "4354955e9d8637f32b7c78b20af2a58f842ba39e" }

# The profile stays independently testable until the desktop host's active
# protocol and Genet migration gates admit it into the root workspace.
[workspace]
