<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mesocosm V1 WebGPU receipt</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, monospace; }
    body { margin: 0; background: #08100d; color: #c9f5dd; }
    canvas { display: block; width: min(100vw, 960px); height: auto; margin: 0 auto; }
    pre { margin: 0; padding: 1rem; white-space: pre-wrap; font-size: 12px; }
    body[data-status="loading"] pre::before { content: "booting WebGPU..."; }
    body[data-status="error"] pre { color: #ff9d9d; }
  </style>
</head>
<body data-status="loading">
  <pre id="receipt"></pre>
  <script type="module">
    import init from './mesocosm_v1.js';
    init().catch(error => {
      document.body.dataset.status = 'error';
      document.querySelector('#receipt').textContent = String(error?.stack || error);
    });
  </script>
</body>
</html>
