[package]
name = "mesocosm-render"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
description = "Mesocosm's body renderer: turns meshed bodies into frames on wgpu. Headless-first, so 'the part is visible' is a test rather than an opinion."
repository = "https://github.com/merely-made/mesocosm"
publish = false

# wgpu is declared once, at the workspace root, so this workspace cannot end up
# with two device types. The pin and the reason for it live there.
[dependencies]
mesocosm-core = { workspace = true }
mesocosm-mesh = { workspace = true }
wgpu = { workspace = true }
bytemuck = { version = "1", features = ["derive"] }
glam = "0.30"
pollster = "0.4"

[dev-dependencies]
# Only for the example that writes a frame to disk for a human to look at.
png = "0.17"
mesocosm-runtime = { workspace = true }
