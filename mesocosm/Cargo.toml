[package]
name = "mesocosm"
version = "0.0.2"
edition = "2024"
license = "MPL-2.0"
description = "Name reservation. Mesocosm is a first-person game of lineages: you are a critter in an enclosed mid-scale ecosystem, you grow by incorporating other organisms, and you try to make your kind matter."
repository = "https://github.com/merely-made/mesocosm"
readme = "README.md"
keywords = ["game", "ecosystem", "evolution", "voxel", "simulation"]
categories = ["games"]
exclude = ["design_docs/"]

# Own workspace root. The reservation package plus the crates that have split
# out so far.
#
# Game and application crates use MPL-2.0. A promoted reusable library also
# stays MPL-2.0 (ruled 2026-09-03, retiring the 2026-07-31 clause that let a
# proven boundary take MIT OR Apache-2.0): see LICENSES.md.
[workspace]
members = [
    "crates/mesocosm-core",
    "crates/mesocosm-genet",
    "crates/mesocosm-lens",
    "crates/mesocosm-mesh",
    "crates/mesocosm-phenotype",
    "crates/mesocosm-render",
    "crates/mesocosm-runtime",
    "crates/mesocosm-views",
]

[workspace.dependencies]
# The append-only journal, from mere's eidetic family. Rev-pinned with the
# rest of the family; its causal shape landed 2026-08-01 for exactly this use.
muniment = { git = "https://github.com/merely-made/mere.git", rev = "d82afa17e2cca86da843f07a2d718d2e69eb9f10" }
# Shared voxel value mechanics. Mesocosm keeps `Ground` as the durable
# authority; its product adapter consumes revisioned chunk and patch machinery
# as a derived view over accepted ground revisions without acquiring a physics
# backend.
nisus = { git = "https://github.com/merely-made/mere.git", rev = "d82afa17e2cca86da843f07a2d718d2e69eb9f10" }
# The shared tactile runtime: bodies, voxel collision, and spatial queries
# with Rapier private inside it. Mesocosm consumes advice through Conatus ids
# and arrays only; the T1 adapter in mesocosm-runtime is its product home.
conatus = { git = "https://github.com/merely-made/mere.git", rev = "d82afa17e2cca86da843f07a2d718d2e69eb9f10" }
# Product-neutral sparse brick carriage and ray-in WGSL traversal. Product
# lenses keep source binding, camera, material, and composition policy.
modulus = { git = "https://github.com/merely-made/mere.git", rev = "d82afa17e2cca86da843f07a2d718d2e69eb9f10" }
# The scenograph projection contract and its solvers: the adapter-first UI
# posture. Mesocosm discloses facts as a score; scenomise places them; a host
# realizes the scene. Views never hand-roll layout.
sceno = { git = "https://github.com/merely-made/mere.git", rev = "d82afa17e2cca86da843f07a2d718d2e69eb9f10" }
scenomise = { git = "https://github.com/merely-made/mere.git", rev = "d82afa17e2cca86da843f07a2d718d2e69eb9f10" }
# Custom-paint leaves, from the cambium family. The family moved from genet to
# mere on 2026-09-03 (platform boundary plan P3); the crate is unchanged.
# Git-only, never crates.io.
sprigging = { git = "https://github.com/merely-made/mere.git", rev = "d82afa17e2cca86da843f07a2d718d2e69eb9f10" }
# The cambium lane (ruled 2026-08-29): ordinary game GUI with words and
# numbers. Now from mere.git with the rest of the cambium family. Same git
# source and same rev as sprigging — cargo keys git sources by URL *plus*
# reference, so two references would be two crate identities of one commit.
# mere pins genet at exactly the rev this workspace does, and both pin the
# netrender family at the same rev, which is what keeps one `PaintCmd`.
cambium = { git = "https://github.com/merely-made/mere.git", rev = "d82afa17e2cca86da843f07a2d718d2e69eb9f10" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", rev = "115d348deddc344d949754e63beaece47cf49f34" }
# The CSS/layout/paint engine. `genet-layout` is gone: genet deleted the Stylo
# compatibility cone on 2026-08-21 and Livery over Buckram is what lays out a
# ScriptedDom now. Isometry's host still names the old crate, so read that one
# for the shape and this for the calls.
genet-livery = { git = "https://github.com/merely-made/genet.git", rev = "115d348deddc344d949754e63beaece47cf49f34" }
# Reusable split-and-tab tile arrangement (ruled 2026-09-02, dev tools plan
# §4): the dev lane's placement is a `workbench::TileTree`'s own geometry
# rather than a hand-rolled corner constant. Moved to mere with the cambium
# family; same git source and rev as cambium, for the reason stated above it.
workbench = { git = "https://github.com/merely-made/mere.git", rev = "d82afa17e2cca86da843f07a2d718d2e69eb9f10" }
# The shared automatability substrate and scenario driver (DT4): `Automatable`,
# `Driveable`, and a text `Scenario` over the cambium surfaces this workspace
# already emits. It replaces the bespoke replay-and-demo harness rather than
# sitting beside it — the dev tools plan's principle 4. It stayed in genet when
# cambium left, so it is a genet.git pin — at the same rev mere itself pins
# genet, which is what keeps one genet in the graph.
genet-probe = { git = "https://github.com/merely-made/genet.git", rev = "115d348deddc344d949754e63beaece47cf49f34" }
# The HUD lane (route A, ruled 2026-08-02): leaves paint PaintCmds,
# paint_list_render lowers them, netrender rasterizes on the game's own
# device. The wgpu-29 pin below exists for exactly this sharing.
netrender = { git = "https://github.com/merely-made/netrender.git", rev = "6f1a4fe70a58a57ba6b248acfa662f0ec4e44a25" }
paint_list_api = { git = "https://github.com/merely-made/netrender.git", rev = "6f1a4fe70a58a57ba6b248acfa662f0ec4e44a25" }
paint_list_render = { git = "https://github.com/merely-made/netrender.git", rev = "6f1a4fe70a58a57ba6b248acfa662f0ec4e44a25" }
# RG3 compatibility lane. Genet and Mere still expose the older paint-list
# source identity above; this alias uses the same physical wgpu handles and
# owns only the opaque-tenant frame master until those pins align.
netrender_graph = { package = "netrender", git = "https://github.com/merely-made/netrender.git", rev = "93b221a5e48e80fe992feddf42b00dbe1eea3713" }
mesocosm-core = { path = "crates/mesocosm-core", version = "0.0.1" }
mesocosm-lens = { path = "crates/mesocosm-lens", version = "0.0.1" }
mesocosm-mesh = { path = "crates/mesocosm-mesh", version = "0.0.1" }
mesocosm-phenotype = { path = "crates/mesocosm-phenotype", version = "0.0.1" }
mesocosm-render = { path = "crates/mesocosm-render", version = "0.0.1" }
mesocosm-genet = { path = "crates/mesocosm-genet", version = "0.0.1" }
mesocosm-runtime = { path = "crates/mesocosm-runtime", version = "0.0.1" }
mesocosm-views = { path = "crates/mesocosm-views", version = "0.0.1" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }

# ONE wgpu for the whole workspace. Two versions in one process are two
# incompatible device types, and this game is meant to share a device with
# netrender rather than create a second one.
#
# On 30 as of 2026-08-16, with the family. The 29 pin here existed because
# **vello gated it**: netrender rasterized through `vello = "0.9"`, which
# requires `wgpu ^29.0.3` and semver-excludes 30. Vello still has not shipped
# a wgpu-30 release (0.10, 2026-08-14, is still on 29, and their own migration
# PR is stalled), so the family took vello from an owned fork instead: the
# v0.10.0 tag plus the API changes from linebender/vello#1754. That is what
# unblocks this row, and it is why the `[patch.crates-io]` below is not
# optional here.
#
# Backends are named here because `default-features = false` turns them all
# off, and an instance with no backend panics at construction rather than
# reporting a missing adapter. Sibling repos omit them because their leaf
# binaries supply them; this workspace is its own leaf.
wgpu = { version = "30", default-features = false, features = [
    "std",
    "wgsl",
    "dx12",
    "vulkan",
    "metal",
    "gles",
    "webgpu",
] }

[dependencies]

# Vello on wgpu 30, from the owned fork. Upstream vello 0.10 still requires
# wgpu 29 and their migration PR is stalled, so netrender (and through it this
# workspace's frame) takes vello from the v0.10.0 tag plus the API changes in
# linebender/vello#1754. `[patch]` applies only from the top-level manifest
# and is not inherited from netrender, so this workspace restates it. Retires
# by deletion when upstream ships a wgpu-30 vello.
[patch.crates-io]
vello = { git = "https://github.com/mark-ik/vello.git", branch = "mark-ik/wgpu-30" }
# Genet's vendored parley. `[patch]` does not inherit through a git dep, so a
# consumer of genet-livery must restate this: published parley 0.10 lacks the
# `AlignmentOptions::last_line_alignment` field and the `StyleProperty::TabSize`
# variant that Livery's text system is written against, and the mismatch reads
# as three baffling compile errors inside a crate you did not write.
parley = { git = "https://github.com/merely-made/genet.git", rev = "115d348deddc344d949754e63beaece47cf49f34" }
