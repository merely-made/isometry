[package]
name = "paredros-world"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
description = "Paredros world, body, population, project, simulation, and replay systems."
repository = "https://github.com/merely-made/isometry"
publish = false

# F0a consumes Mesocosm's current verb-neutral topology and material facts,
# while Paredros owns what those slots mean and what history does to them.
# The path dependency is product proof, not a permanent ownership ruling.
[dependencies]
wing-functions = { path = "../../../shared/wing-functions" }
conatus = { workspace = true }
mesocosm-core = { version = "0.0.1", path = "../../../mesocosm/crates/mesocosm-core" }
paredros-identity = { version = "0.0.1", path = "../paredros-identity" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
