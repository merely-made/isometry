[package]
name = "paredros-sortie"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
description = "S3, the joint receipt: one sortie and return, where willingness and embodiment meet."
repository = "https://github.com/merely-made/paredros"
publish = false

# The one crate allowed to read both owners. The execution plan's two-owners
# rule keeps social willingness and combat execution apart; S3 is where they
# meet, so this crate depends on both and neither depends back. The world and
# kinematics come through paredros-room exactly as S0 consumes them (which
# brings the render stack along in the build; the sim here never touches it).
[dependencies]
paredros-identity = { version = "0.0.1", path = "../paredros-identity" }
paredros-social = { version = "0.0.1", path = "../paredros-social" }
paredros-room = { version = "0.0.1", path = "../paredros-room" }
mesocosm-core = { version = "0.0.1", path = "../../../mesocosm/crates/mesocosm-core" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
