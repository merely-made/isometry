[package]
name = "wing-formats"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Versioned primitive interchange formats for the games wing."
repository = "https://github.com/merely-made/isometry"
publish = false

[workspace]
members = ["."]
resolver = "2"

[dependencies]
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
