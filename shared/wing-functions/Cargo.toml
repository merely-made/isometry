[package]
name = "wing-functions"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false
repository = "https://github.com/merely-made/isometry"
description = "Bounded, deterministic functional networks for body-part consumers."

[workspace]
members = ["."]
resolver = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
