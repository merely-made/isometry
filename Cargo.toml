[workspace]
resolver = "2"
members = [
    "crates/isometry-core",
    "crates/isometry-campaign",
    "crates/isometry-graphshell",
    "crates/isometry-views",
    "crates/isometry-genet",
    "crates/isometry-net",
    "crates/isometry-system",
    "crates/isometry-voxel",
]
exclude = ["crates/isometry-runtime"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Mark <sgt.mark3@gmail.com>"]
repository = "https://github.com/merely-made/isometry"
rust-version = "1.80"

[workspace.dependencies]
# Internal crates
isometry-core = { path = "crates/isometry-core", version = "0.1.0" }
isometry-campaign = { path = "crates/isometry-campaign", version = "0.1.0" }
isometry-voxel = { path = "crates/isometry-voxel", version = "0.1.0" }
isometry-views = { path = "crates/isometry-views", version = "0.1.0" }
isometry-net = { path = "crates/isometry-net", version = "0.1.0" }
isometry-system = { path = "crates/isometry-system", version = "0.1.0" }
# Private host-side choice receipts. The committed source stays on Git; a local
# Cleromancy checkout is supplied by the machine-local source patch during
# paired development.
cleromancy = { git = "https://github.com/merely-made/cleromancy.git", branch = "main", default-features = false }

# Persistence
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = { version = "1", features = ["alloc"], default-features = false }
# Portable slots/blobs over a host-chosen backend. Isometry uses its redb
# backend for private desktop campaign state; the future web host can swap
# the backend without changing campaign data.
muniment = { git = "https://github.com/merely-made/mere.git", branch = "main" }
# Host-neutral actor runtime for background host/session work. The SerVal
# application owns its state on the winit thread and drains typed updates.
armillary = { git = "https://github.com/merely-made/mere.git", branch = "main" }
personae = { git = "https://github.com/merely-made/mere.git", branch = "main" }
mooting = { git = "https://github.com/merely-made/mere.git", branch = "main" }
# Murm's peer-exchange replication foundation (SyncedSpace/MunimentStore/
# processor). Split out of `mooting` by mere's murm peer-runtime work; mooting
# now keeps only governance policy.
murm-replication = { package = "stickleback", git = "https://github.com/merely-made/mere.git", branch = "main" }
gemot = { git = "https://github.com/merely-made/mere.git", branch = "main" }
# mere renamed the package to `mere-transport` (the lib is still `transport`),
# and `[patch]` keys match the *package* name, so both this dep and the local
# override in .cargo/config.toml must say so.
transport = { package = "mere-transport", git = "https://github.com/merely-made/mere.git", branch = "main" }
murm = { git = "https://github.com/merely-made/mere.git", branch = "main" }
p2panda-core = "0.7.0"
# The net crate is the **published** `mere-p2panda-net =0.7.2`, taken exactly
# as `mere-transport` and `stickleback` take it: same package, same exact
# version, same features. isometry-net composes `LogSync` on the endpoint
# `P2pandaTransport::sync_parts` hands it, so a different dep line here lands a
# second net crate and the endpoint types stop matching. Every feature except
# `sqlite`: the address book runs on stickleback's muniment-backed store, and
# feature unification means every consumer has to opt out, not just one.
p2panda-net = { package = "mere-p2panda-net", version = "=0.7.2", default-features = false, features = [
    "address_book",
    "iroh_endpoint",
    "iroh_mdns",
    "discovery",
    "gossip",
    "sync",
] }
p2panda-store = { version = "0.7.0", default-features = false }
p2panda-sync = "0.7.0"
thiserror = "1"

# Product-free projection score and analytic solvers. Isometry owns the
# campaign-to-score adapter in `isometry-views`; the shared crates carry only
# opaque source refs, measured footprints, and scenes.
sceno = { git = "https://github.com/merely-made/mere.git", branch = "main" }
scenomise = { git = "https://github.com/merely-made/mere.git", branch = "main" }
graphshell-endpoint = { git = "https://github.com/merely-made/mere.git", branch = "main" }
# The projection contract. Was `graphshell-protocol`; mere renamed it to
# `chirograph` on 2026-08-14 because the contract is the family's, not the
# portal's. Same types, same re-exports.
chirograph = { git = "https://github.com/merely-made/mere.git", branch = "main" }
graphshell-stdio = { git = "https://github.com/merely-made/mere.git", branch = "main" }

# UI: the shared Cambium desktop host. Git deps on the owned repos so any
# machine resolves; local checkouts override via the gitignored
# .cargo/config.toml source-specific [patch] entries. Cambium supplies the view
# toolkit; `cambium-genet-winit-host` supplies the whole native assembly.
# **Git, not crates.io** (Mark's ruling, 2026-07-26): the family resolves from
# genet.git until there is an actual GitHub release to consume, and crates.io
# releases keep being cut for external consumers rather than for us. Isometry was
# the only repo still taking these from the registry, and it was the one carrying
# the hazard: published cambium/sprigging resolve `paint_list_api` from crates.io
# while this workspace git-deps netrender's, so `sprigging::PaintCmd` was not
# `paint_list_api::PaintCmd`. The gitignored [patch] file hid that here by
# redirecting sprigging to a path; a clean checkout would not have.
#
# The node-label floor the registry pin used to state is carried by the pin
# below: `with_node_labels` labels only carry node state from 0.3.2 on, and
# `eff0cb6` is well past it.
#
# Every Genet crate takes the SAME reference, and that reference is the one
# Mere main pins (`eff0cb6`, 2026-09-02). Isometry follows Mere's Genet
# reference, which is the rule woodshed's own manifest states; the family
# either agrees on one revision or Cargo keys two git sources by URL+reference
# and lands two copies of Cambium and its host types. The gitignored local
# patch table unifies both onto one checkout and can hide that split, which is
# why the committed manifest must align with the consumer pin.
cambium = { git = "https://github.com/merely-made/genet.git", rev = "86019eacccc63fe41b6f859d55b7ab49e2aad87c" }
# The single-root Cambium desktop host (genet G1, 2026-08-09). It owns the
# winit lifecycle, the surface, layout, paint, hit testing, input routing and
# the AccessKit sync isometry used to assemble by hand — so the direct deps
# that assembly needed (genet-layout, genet-winit-host, cambium-winit,
# netrender, paint_list_*, wgpu, winit) are gone from this workspace. They
# still arrive transitively; only what isometry may *name* changed.
cambium-genet-winit-host = { git = "https://github.com/merely-made/genet.git", rev = "86019eacccc63fe41b6f859d55b7ab49e2aad87c" }
# Cambium's retained custom-paint leaves (the graph-canvas swatch's painted
# nodes + edges). A host wires them directly, the pelt-desktop pattern. From the
# same git source as cambium, which is what keeps one `PaintCmd` in the graph.
sprigging = { git = "https://github.com/merely-made/genet.git", rev = "86019eacccc63fe41b6f859d55b7ab49e2aad87c" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", rev = "86019eacccc63fe41b6f859d55b7ab49e2aad87c", version = "=0.1.0" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", rev = "86019eacccc63fe41b6f859d55b7ab49e2aad87c", version = "=0.1.0" }
# The shared automatability substrate: selector resolution, so isometry's
# host-routing receipts target a control by role and label rather than pixel.
genet-probe = { git = "https://github.com/merely-made/genet.git", rev = "86019eacccc63fe41b6f859d55b7ab49e2aad87c" }

# Mirror of genet's [patch.crates-io] entries this workspace's genet
# graph needs; patches are per-workspace-root and do NOT inherit through
# a git dep. The genet half takes the same pin as the deps above.
[patch.crates-io]
# `murm-replication` (from mere) depends on the *published* muniment, while this
# workspace tracks the repo. Two sources means two `muniment::Backend` traits and
# `MunimentStore`'s bounds stop matching, so redirect the registry edge at the
# same git source: exactly one muniment lands. Track the branch, not a pin.
muniment = { git = "https://github.com/merely-made/mere.git", branch = "main" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", rev = "86019eacccc63fe41b6f859d55b7ab49e2aad87c", version = "=0.1.0" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", rev = "86019eacccc63fe41b6f859d55b7ab49e2aad87c", version = "=0.1.0" }
# NO stylo / stylo_atoms / stylo_taffy patch. Genet retired Stylo and the
# incumbent layout cone on 2026-08-21 (`55c05d11`), so genet.git no longer
# provides `stylo_taffy` at any revision the family pins and the entry that
# stood here failed the whole workspace at resolution rather than just the
# Stylo lane:
#
#   error: patch location `...genet.git?branch=main` does not contain
#   packages matching `stylo_taffy`
#
# Nothing here depends on it; the entry outlived its subject. Taffy is
# different: Buckram and Livery consume the renamed `genet-taffy` package, so
# the patch below names that package explicitly while keeping the dependency
# alias Cargo expects.
taffy = { package = "genet-taffy", git = "https://github.com/merely-made/genet.git", rev = "86019eacccc63fe41b6f859d55b7ab49e2aad87c", version = "=0.14.0" }
# Genet Livery uses AlignmentOptions::last_line_alignment and
# StyleProperty::TabSize from Genet's Parley fork. Published Parley 0.10.0 has
# the same version but not those APIs, so a clean consumer must restate the
# workspace patch.
parley = { git = "https://github.com/merely-made/genet.git", rev = "86019eacccc63fe41b6f859d55b7ab49e2aad87c" }
# ipc-channel: genet's in-process fork (force-inprocess default; drops the
# windows 0.61 pin that broke gpu-allocator/wgpu-hal unification).
ipc-channel = { git = "https://github.com/merely-made/genet.git", rev = "86019eacccc63fe41b6f859d55b7ab49e2aad87c" }
# `murm-replication` (stickleback) and `mere-transport` are written against the
# **owned p2panda fork**, not the published crates. mere's manifest repoints the
# family there; this workspace must mirror it, or it resolves stock p2panda from
# crates.io and stickleback fails to compile against it.
#
# **The family patches together or not at all.** The fork's crates path-dep each
# other, so repointing one alone lands two `p2panda-core` copies and the trait
# bounds stop matching. `p2panda-sync` is patched even though nothing but the
# net crate reaches it in mere, because this workspace declares it directly for
# isometry-net's LogSync composition and would otherwise pull a registry copy.
#
# The reference is mere's, and it is the immutable release tag rather than a
# branch: a branch lets the two workspaces drift a commit apart, which is the
# same duplicate hazard by another route. Keep no local paths here; the
# machine-local redirect belongs in the gitignored `.cargo/config.toml`.
p2panda-auth = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.2" }
p2panda-core = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.2" }
p2panda-discovery = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.2" }
p2panda-encryption = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.2" }
p2panda-store = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.2" }
p2panda-sync = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.2" }
# There is deliberately no `p2panda-net` entry, matching mere: that package name
# is no longer consumed anywhere in the graph. The net crate is the published
# `mere-p2panda-net =0.7.2`, named directly in [workspace.dependencies] above,
# so a patch on `p2panda-net` would be permanently unused.
#
# `p2panda-stream` is deliberately absent too, though mere patches it. Nothing
# here reaches it even under `--all-features` — stickleback names it as a
# dev-dependency only — so the entry would produce a permanent "patch was not
# used" warning. That matters more than it sounds: a wall of those warnings is
# what hid the whole p2panda divergence for a session. The omission is safe
# because the duplicate-copy hazard only applies to crates actually in the
# graph, and if something later pulls `p2panda-stream` from the registry the
# result is a loud trait-bound mismatch, not a silent second copy. Add it back
# at that point.

# Vello on wgpu 30. Upstream vello 0.10 still requires wgpu 29, so netrender
# (and through it this app's render path) takes vello from the owned fork:
# the v0.10.0 tag plus exactly the API changes in linebender/vello#1754.
# `[patch]` applies only from the top-level manifest and is NOT inherited
# from genet or netrender, so every app workspace restates it. Retires by
# deletion when upstream ships a wgpu-30 vello.
vello = { git = "https://github.com/mark-ik/vello.git", branch = "mark-ik/wgpu-30" }
